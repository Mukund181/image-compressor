version: '3.8'

services:
  image-compressor:
    image: mukund181/image-compressor:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-compressor-app
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
