services:
  image-compressor:
    image: mukund181/image-compressor:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-compressor-app
    ports:
      - '80:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters in .env}
      MONGODB_URI: ${MONGODB_URI:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - downloads:/usr/src/app/temp_downloads
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  downloads:
