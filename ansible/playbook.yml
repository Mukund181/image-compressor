---
- name: Deploy OmniTools Consumer Application to AWS EC2 Instance
  hosts: webserver
  become: yes
  vars:
    docker_image: 'mukund181/image-compressor:latest'
    container_name: 'image-compressor-app'
    app_port_host: 80
    app_port_container: 3000
    app_env_source: '{{ playbook_dir }}/../.env'

  pre_tasks:
    - name: Wait for the instance SSH service
      wait_for_connection:
        timeout: 300

    - name: Create application configuration directory
      file:
        path: /opt/omnitools
        state: directory
        mode: '0700'

    - name: Install runtime environment separately from the image
      copy:
        src: '{{ app_env_source }}'
        dest: /opt/omnitools/app.env
        mode: '0600'
      no_log: true

  tasks:
    - name: Update apt cache & install system prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
        state: present
        update_cache: yes

    - name: Create directory for Docker keyring
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present

    - name: Install Docker Engine and Docker Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Stop conflicting snap docker or stale services if present
      shell: |
        systemctl stop snap.docker.dockerd 2>/dev/null || true
        systemctl reset-failed docker containerd 2>/dev/null || true
      failed_when: false

    - name: Ensure containerd is enabled and running
      systemd:
        name: containerd
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Ensure Docker service is enabled and running
      systemd:
        name: docker
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: Verify Docker is functional
      command: docker info
      changed_when: false

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Pull latest Docker image from Docker Hub
      command: docker pull {{ docker_image }}

    - name: Check if existing app container is running
      command: docker ps -a -q --filter name={{ container_name }}
      register: existing_container

    - name: Stop and remove old app container if it exists
      command: docker rm -f {{ container_name }}
      when: existing_container.stdout != ""

    - name: Run OmniTools Docker container with environment options
      command: >
        docker run -d
        --name {{ container_name }}
        --restart always
        -p {{ app_port_host }}:{{ app_port_container }}
        --env-file /opt/omnitools/app.env
        -v omnitools-downloads:/usr/src/app/temp_downloads
        -e NODE_ENV=production
        -e PORT={{ app_port_container }}
        {{ docker_image }}

    - name: Wait for OmniTools App to be healthy and accessible
      uri:
        url: 'http://localhost:{{ app_port_host }}/api/health'
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 10
      delay: 3

    - name: Output deployment confirmation
      debug:
        msg: '🎉 Deployment successful! OmniTools is live on http://{{ inventory_hostname }}'
