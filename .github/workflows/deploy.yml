name: CI/CD Pipeline - Docker Build & AWS Deployment

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - name: Install document conversion runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-core fonts-noto-color-emoji
      - run: npm run check
      - run: npm test
        env:
          NODE_ENV: test

  build-and-push-docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.publish.outputs.enabled }}
    env:
      DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Determine whether publishing is configured
        id: publish
        run: |
          if [ -n "$DOCKER_TOKEN" ] && [ "$EVENT_NAME" != "pull_request" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
      - name: Log in to Docker Hub
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: mukund181
          password: ${{ env.DOCKER_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          tags: |
            mukund181/image-compressor:latest
            mukund181/image-compressor:${{ github.sha }}

  deploy-to-aws-ec2:
    name: Deploy Container via Ansible to AWS EC2
    needs: build-and-push-docker
    if: needs.build-and-push-docker.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH Private Key
        run: |
          mkdir -p terraform
          echo "${{ secrets.EC2_SSH_KEY }}" > terraform/ec2_key.pem
          chmod 600 terraform/ec2_key.pem

      - name: Configure Production Environment File
        run: |
          if [ -n "${{ secrets.APP_ENV }}" ]; then
            echo "${{ secrets.APP_ENV }}" > .env
          elif [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Configure EC2 IP in Ansible Inventory
        run: |
          EC2_IP="${{ secrets.EC2_HOST }}"
          if [ -n "$EC2_IP" ]; then
            echo "[webserver]" > ansible/inventory.ini
            echo "$EC2_IP ansible_user=ubuntu ansible_ssh_private_key_file=../terraform/ec2_key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini
          fi
          cat ansible/inventory.ini

      - name: Run Ansible Playbook
        run: |
          cd ansible
          ansible-playbook -i inventory.ini playbook.yml -e "docker_image=mukund181/image-compressor:${{ github.sha }}"
